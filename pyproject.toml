[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyengines"
version = "1.0.0b1"
description = "A Python library for engines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyglet",
    "watchdog",
    "PySide6",
    "pybullet-arm64",
    "ogre-python",
    "immersive-audio",
    "requests",
    "pywin32; sys_platform == 'win32'",
    "timezonefinder",
    "astral",
]

[tool.hatch.build.targets.wheel]
packages = ["pyengines"]
